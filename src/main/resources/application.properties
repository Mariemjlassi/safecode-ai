# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8081

# ─── PostgreSQL datasource ───────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/safecode
spring.datasource.username=postgres
spring.datasource.password=mariem
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# create-drop for local dev; switch to validate or none in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ─── Spring AI — OpenAI-compatible endpoint ──────────────────────────────────
# Set SPRING_AI_OPENAI_API_KEY in the environment (or override here for local dev).
# To target watsonx.ai, point the base-url at your watsonx project endpoint and
# set the api-key to your IBM Cloud IAM token.
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:changeme}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_MODEL:gpt-4o-mini}
